version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: dora-postgres
    environment:
      POSTGRES_USER: dora_admin
      POSTGRES_PASSWORD: dora_password
      POSTGRES_DB: dora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: